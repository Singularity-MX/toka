
name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ vars.HOSTINGER_PORT }} \
            ${{ vars.HOSTINGER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ vars.HOSTINGER_PORT }}" \
            dist/ \
            ${{ vars.HOSTINGER_USER }}@${{ vars.HOSTINGER_HOST }}:/home/${{ vars.HOSTINGER_USER }}/domains/toka.singularitymx.org/public_html/
